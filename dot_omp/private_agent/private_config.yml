modelRoles:
  default: openai-codex/gpt-6.1-sol
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: default
  separator: pipe
personality: default
commands:
  enableClaudeUser: true
extensions:
  - ~/.claude/hooks/enforce-cli-tools/pi.ts
  - ~/.claude/hooks/lint-all-languages/pi.ts
  - ~/.claude/hooks/block-commit-attribution/pi.ts
  - ~/.claude/hooks/block-secret-commits/pi.ts
  - ~/.claude/hooks/format-all-languages/pi.ts
  - ~/.claude/hooks/format-org-tables/pi.ts
  - ~/.claude/hooks/lint-prose/pi.ts
  - ~/.claude/hooks/type-check-tsc/pi.ts
  - ~/.claude/hooks/type-check-pyrefly/pi.ts
  - ~/.claude/hooks/track-session-changes/pi.ts
