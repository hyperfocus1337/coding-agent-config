modelRoles:
  default: openai-codex/gpt-6.1-sol
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: default
  separator: pipe
personality: default
commands:
  enableClaudeUser: true
extensions:
  - ~/.claude/hooks/block-destructive-commands/pi.ts
  - ~/.claude/hooks/enforce-cli-tools/pi.ts
  - ~/.claude/hooks/lint-code/omp.ts
  - ~/.claude/hooks/format-code/pi.ts
  - ~/.claude/hooks/format-code/omp.ts
  - ~/.claude/hooks/type-check-tsc/omp.ts
  - ~/.claude/hooks/type-check-pyrefly/omp.ts
  - ~/.claude/hooks/track-session-changes/omp.ts
  - ~/.claude/hooks/lint-prose/omp.ts
  - ~/.claude/hooks/toggle-hook/pi.ts
