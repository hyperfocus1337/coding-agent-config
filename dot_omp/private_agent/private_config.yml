modelRoles:
  default: openai-codex/gpt-6.1-sol
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
dev:
  autoqaConsent: granted
statusLine:
  preset: default
  separator: pipe
personality: default
commands:
  enableClaudeUser: true
extensions:
  - ~/.claude/hooks/enforce-cli-tools/pi.ts
  - ~/.claude/hooks/lint-all-languages/pi.ts
  - ~/.claude/hooks/block-commit-attribution/pi.ts
