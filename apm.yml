name: coding-agent-config
version: 0.1.0
description: Cross-agent dependency manifest (MCP servers + third-party skills)
author: hyperfocus1337
# Which agent platforms to deploy to. Only Claude today; add cursor, codex,
# gemini, etc. here (or via --target) to fan these deps out to more agents.
# Resolution order: --target flag > this field > auto-detect from filesystem.
targets:
  - claude
dependencies:
  # Portable skills. No lockfile: install re-resolves to latest upstream every
  # run (--update in install.sh).
  apm:
    # terraform-skill, moved off the `claude plugin` CLI. Which other plugins
    # were considered and why they stayed: docs/apm/plugin-migration.md.
    - git: antonbabenko/terraform-skill
    # Cursor's team kit, nested plugin layout. Subpath ref (owner/repo/plugin)
    # resolves .cursor-plugin/plugin.json, so apm finds the nested skills/ dir.
    # No `agents:` subset key exists, so this also deploys the kit's 2 agents.
    - git: cursor/plugins/cursor-team-kit
      skills:
        - thermo-nuclear-code-quality-review
    # Neon skills only. The neon-postgres plugin bundles a hosted Neon MCP that
    # can't be disabled per-server, so we take just the skills via APM (which
    # never wires mcp.json). Resolved from the repo's top-level skills/ dir.
    - git: neondatabase/agent-skills
      skills:
        - neon
        - neon-postgres
        - neon-postgres-branches
  # User-scoped MCP servers. Secrets come from the environment at install time
  # (${VAR}) so this manifest stays committable.
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp"
      env:
        CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
  # tessl, jcodemunch, jdocmunch, claude-design and orbit are project-scoped
  # opt-in servers, not user-scoped installs: install them per-project with the
  # install-mcp skill. Catalog: docs/mcp/project-servers.md.
  # LSP servers. Binary must be on $PATH at install time.
  lsp:
    - name: pyright
      command: pyright-langserver
      args:
        - --stdio
      transport: stdio
      extensionToLanguage:
        .py: python
        .pyi: python
includes: auto
scripts: {}
