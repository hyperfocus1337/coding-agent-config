name: coding-agent-config
version: 0.1.0
description: Cross-agent dependency manifest (MCP servers + third-party skills)
author: hyperfocus1337
# Which agent platforms to deploy to. Only Claude today; add cursor, codex,
# gemini, etc. here (or via --target) to fan these deps out to more agents.
# Resolution order: --target flag > this field > auto-detect from filesystem.
targets:
  - claude
dependencies:
  # Portable skills. No lockfile: install re-resolves to latest upstream every
  # run (--update in install.sh).
  apm:
    # terraform-skill, moved off the `claude plugin` CLI. Which other plugins
    # were considered and why they stayed: docs/research/install/plugin-migration.md.
    # Subpath ref to the skill dir: the repo root has only .codex-plugin/, and
    # apm 0.35+ refuses that native bundle unless the codex target is selected.
    - git: antonbabenko/terraform-skill/skills/terraform-skill
    # show-me: /show-me renders the current topic as diagrams or an HTML file.
    # Subpath ref: the skill lives inside a Claude plugin dir.
    - git: humanlayer/skills/plugins/show-me/skills/show-me
    # security-audit: defensive source-first audit workflow. Subpath ref: the repo
    # root has no SKILL.md or apm.yml.
    - git: cloudflare/security-audit-skill/skills/security-audit
  # User-scoped MCP servers. Secrets come from the environment at install time
  # (${VAR}) so this manifest stays committable.
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@upstash/context7-mcp"
      env:
        CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
  # LSP servers. Binary must be on $PATH at install time.
  lsp:
    - name: pyright
      command: pyright-langserver
      args:
        - --stdio
      transport: stdio
      extensionToLanguage:
        .py: python
        .pyi: python
includes: auto
scripts: {}
